name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: his
          POSTGRES_PASSWORD: his
          POSTGRES_DB: his
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U his -d his"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://his:his@localhost:5432/his?schema=public
      NODE_ENV: test
      PORT: 3000
      JWT_SECRET: ci-secret
      JWT_EXPIRES_IN: 1h
      ADMIN_EMAIL: admin@his.local
      ADMIN_PASSWORD: Admin1234!

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # la versión sale de packageManager en package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests unitarios
        run: pnpm test

      - name: Reglas de arquitectura (dependency-cruiser)
        run: pnpm arch

      - name: Migraciones
        run: pnpm --filter @his/api prisma:deploy

      - name: Seed (roles, permisos, admin, catálogos)
        run: pnpm --filter @his/api prisma:seed

      - name: Tests de integración
        run: pnpm test:integration

      - name: Build
        run: pnpm build
